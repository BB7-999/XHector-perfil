<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discord XH3ctor</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#fff;--muted:#b9b9c2;--panel:#17171c;--line:#2c2c35;--acc:#fff;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#0b0b0f;color:var(--ink);font:400 16px/1.5 Outfit,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 120%,#3a3a48,transparent 60%),linear-gradient(#0b0b0f,#1a1a22);background-size:cover;background-position:center}
#dim{position:fixed;inset:0;z-index:-1;background:#000}
#enter{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;font:600 22px Outfit,sans-serif;cursor:pointer;letter-spacing:.02em}
main{max-width:560px;margin:0 auto;padding:56px 20px 90px;display:flex;flex-direction:column;align-items:center;text-align:center}
#av{width:116px;height:116px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#444,#111);display:grid;place-items:center;font:700 46px Outfit;box-shadow:0 0 30px rgba(255,255,255,.15)}
h1{margin:16px 0 0;font:700 44px/1.1 Outfit,sans-serif;text-shadow:0 0 18px var(--acc)}
.sub{font-weight:600;font-size:18px;margin:8px 0 0}
.loc{color:var(--muted);margin:14px 0 0}
.pres{display:flex;gap:14px;align-items:center;margin:26px 0 0;text-align:left}
.pres .a{width:58px;height:58px;border-radius:50%;background:#333;object-fit:cover;position:relative;flex:none}
.dotw{position:relative;flex:none}.dot{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;border:3px solid #111}
.pres b{font-weight:600}.pres small{display:block;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:28px 0 0}
.links a{color:var(--ink);text-decoration:none;font-weight:600;padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);text-shadow:0 0 10px var(--acc)}
.links a:hover{background:rgba(255,255,255,.16)}
.views{align-self:flex-start;margin:34px 0 0;color:var(--muted);font-size:15px}
.player{width:100%;display:flex;gap:14px;align-items:center;margin-top:18px;text-align:left}
.cover{width:62px;height:62px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:28px;flex:none}
.pm{flex:1;min-width:0}.pm .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm .r{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
input[type=range]{flex:1;accent-color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
.pp{width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:#000;font-size:16px;flex:none}
:focus-visible{outline:3px solid #8ab4ff;outline-offset:2px}
#gear{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:20px}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,100%);z-index:30;background:var(--panel);border-left:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;transform:translateX(100%);transition:transform .2s}
#panel.open{transform:none}
#panel h2{margin:0 0 4px;font-size:20px}
#panel label{display:block;margin:14px 0 4px;font-size:14px;color:var(--muted)}
#panel input[type=text],#panel input[type=url],#panel textarea,#panel select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:#0f0f13;color:var(--ink);font:inherit}
#panel input[type=file]{width:100%;font-size:13px}
#panel textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:#23232b}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
#login{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:16px}
#login .box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
#login h2{margin:0 0 6px;font-size:20px}
#login label{display:block;margin:12px 0 4px;font-size:14px;color:var(--muted)}
#login input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:#0f0f13;color:var(--ink);font:inherit}
#lmsg{min-height:20px;margin:10px 0 0;color:#ff7b7b;font-size:14px}
</style>
</head>
<body>
<div id="bg"></div><div id="dim"></div>
<div id="enter" role="button" tabindex="0">Haz clic para entrar</div>

<main>
  <img id="av" alt="" hidden>
  <div id="avl"></div>
  <h1 id="name"></h1>
  <p class="sub" id="sub"></p>
  <p class="loc" id="loc"></p>
  <div class="pres" id="pres">
    <div class="dotw"><img class="a" id="pav" alt="" hidden><div class="a" id="pavl" style="display:grid;place-items:center;font-weight:700"></div><span class="dot" id="dot"></span></div>
    <div><b id="stn"></b><small id="sta"></small></div>
  </div>
  <div class="links" id="links"></div>
  <div class="views" id="views"></div>
  <div class="player" id="player">
    <div class="cover" aria-hidden="true">♫</div>
    <div class="pm">
      <div class="t" id="song"></div>
      <div class="r"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="100" value="0" aria-label="Progreso"><span id="dur">0:00</span></div>
    </div>
    <button class="pp" id="pp" aria-label="Reproducir o pausar">▶</button>
  </div>
</main>
<audio id="au" loop></audio>

<button id="gear" aria-label="Editar perfil">⚙</button>
<div id="login" hidden>
  <form class="box" id="lform" autocomplete="on">
    <h2 id="lt">Entrar a la configuración</h2>
    <label for="lu">Usuario</label><input type="text" id="lu" autocomplete="username">
    <label for="lp">Contraseña</label><input type="password" id="lp" autocomplete="current-password">
    <div id="lp2w" hidden><label for="lp2">Repite la contraseña</label><input type="password" id="lp2" autocomplete="new-password"></div>
    <p id="lmsg" role="alert"></p>
    <div class="row" style="margin-top:8px"><button class="btn" type="submit" id="lok">Entrar</button><button class="btn" type="button" id="lcancel">Cancelar</button></div>
  </form>
</div>
<aside id="panel" aria-label="Editar perfil">
  <div class="row"><h2 style="flex:1">Editar perfil</h2><button class="btn" id="close">Cerrar</button></div>
  <p class="hint">Los cambios se guardan solos en este navegador.</p>

  <label for="k-name">Nombre</label><input type="text" id="k-name" data-k="name">
  <label for="k-sub">Descripción corta</label><input type="text" id="k-sub" data-k="sub">
  <label for="k-loc">Ubicación (vacío para ocultar)</label><input type="text" id="k-loc" data-k="loc">

  <label for="f-av">Foto de perfil (archivo)</label><input type="file" id="f-av" accept="image/*" data-f="av">
  <label for="f-bg">Fondo (imagen o video)</label><input type="file" id="f-bg" accept="image/*,video/*" data-f="bg">
  <label for="k-dim">Oscurecer fondo</label><input type="range" id="k-dim" data-k="dim" min="0" max="90">
  <label for="k-blur">Desenfoque del fondo</label><input type="range" id="k-blur" data-k="blur" min="0" max="20">

  <label for="f-mu">Música (archivo de audio)</label><input type="file" id="f-mu" accept="audio/*" data-f="mu">
  <label for="k-song">Título de la canción</label><input type="text" id="k-song" data-k="song">

  <label for="k-stn">Estado: nombre de usuario</label><input type="text" id="k-stn" data-k="stn">
  <label for="k-sta">Estado: actividad</label><input type="text" id="k-sta" data-k="sta" placeholder="Jugando Minecraft">
  <label for="k-stc">Estado: conexión</label>
  <select id="k-stc" data-k="stc"><option value="#23A55A">En línea</option><option value="#F0B232">Ausente</option><option value="#F23F43">No molestar</option><option value="#80848E">Desconectado</option></select>

  <label for="k-links">Enlaces (uno por línea: Nombre|https://...)</label><textarea id="k-links" data-k="links"></textarea>
  <label for="k-acc">Color de brillo</label><input type="color" id="k-acc" data-k="acc">
  <label><input type="checkbox" id="k-views" data-k="views"> Mostrar contador de visitas</label>

  <div class="row" style="margin-top:20px"><button class="btn" id="reset">Restablecer todo</button></div>
</aside>

<script>
(function(){
var D={name:"TuNombre",sub:"Discord Developer",loc:"Guatemala",stn:"tunombre",sta:"Jugando Visual Studio Code",stc:"#23A55A",
song:"Mi canción favorita",links:"Discord|https://discord.com\nGitHub|https://github.com\nTikTok|https://tiktok.com\nInstagram|https://instagram.com",
acc:"#ffffff",dim:55,blur:0,views:true};
var C={},U={},$=function(i){return document.getElementById(i)};
try{C=JSON.parse(localStorage.getItem("perfil")||"{}")}catch(e){}
function g(k){return C[k]!==undefined?C[k]:D[k]}
function save(){try{localStorage.setItem("perfil",JSON.stringify(C))}catch(e){}}

/* archivos en IndexedDB */
var db;
function open(){return new Promise(function(res){try{var r=indexedDB.open("perfil",1);r.onupgradeneeded=function(){r.result.createObjectStore("f")};r.onsuccess=function(){db=r.result;res()};r.onerror=function(){res()}}catch(e){res()}})}
function fget(k){return new Promise(function(res){if(!db)return res();try{var q=db.transaction("f").objectStore("f").get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){res()}}catch(e){res()}})}
function fset(k,v){return new Promise(function(res){if(!db)return res();try{var t=db.transaction("f","readwrite");v?t.objectStore("f").put(v,k):t.objectStore("f").delete(k);t.oncomplete=res;t.onerror=res}catch(e){res()}})}

function txt(id,v){$(id).textContent=v}
function render(){
  txt("name",g("name"));txt("sub",g("sub"));txt("loc",g("loc")?"📍 "+g("loc"):"");$("loc").hidden=!g("loc");
  txt("song",g("song"));txt("stn",g("stn"));txt("sta",g("sta"));$("dot").style.background=g("stc");
  $("pres").hidden=!g("stn");
  var ini=(g("name")||"?").trim().charAt(0).toUpperCase();
  var hasAv=!!U.av;
  $("av").hidden=!hasAv;$("avl").hidden=hasAv;$("pav").hidden=!hasAv;$("pavl").hidden=hasAv;
  if(hasAv){$("av").src=U.av;$("pav").src=U.av}
  $("avl").outerHTML;var l=$("avl");l.id="avl";l.style.cssText="width:116px;height:116px;border-radius:50%;background:linear-gradient(135deg,#444,#111);display:"+(hasAv?"none":"grid")+";place-items:center;font:700 46px Outfit";l.textContent=ini;
  $("pavl").textContent=ini;
  document.documentElement.style.setProperty("--acc",g("acc"));
  $("dim").style.opacity=g("dim")/100;
  var bg=$("bg");bg.innerHTML="";bg.style.backgroundImage="";bg.style.filter="blur("+g("blur")+"px)";bg.style.transform=g("blur")>0?"scale(1.08)":"";
  if(U.bg){
    if(U.bgType.indexOf("video")===0){var v=document.createElement("video");v.src=U.bg;v.autoplay=v.loop=v.muted=v.playsInline=true;v.style.cssText="width:100%;height:100%;object-fit:cover";bg.appendChild(v);v.play().catch(function(){})}
    else bg.style.backgroundImage="url("+U.bg+")";
  }
  var box=$("links");box.innerHTML="";
  g("links").split("\n").forEach(function(line){
    var p=line.split("|");var n=(p[0]||"").trim(),u=(p[1]||"").trim();
    if(!n)return;
    var a=document.createElement("a");a.textContent=n;a.target="_blank";a.rel="noopener noreferrer";
    a.href=/^https?:\/\//i.test(u)?u:"#";box.appendChild(a);
  });
  $("views").hidden=!g("views");
  $("player").hidden=!U.mu;
  if(U.mu&&$("au").getAttribute("data-src")!==U.mu){$("au").src=U.mu;$("au").setAttribute("data-src",U.mu)}
  if(!U.mu){$("au").removeAttribute("src");$("au").removeAttribute("data-src")}
}

/* visitas (contador local de este navegador) */
var vc=0;try{vc=(+localStorage.getItem("vistas")||0)+1;localStorage.setItem("vistas",vc)}catch(e){vc=1}
txt("views","👁 "+vc);

/* panel */
document.querySelectorAll("[data-k]").forEach(function(el){
  var k=el.dataset.k;
  if(el.type==="checkbox")el.checked=!!g(k);else el.value=g(k);
  el.addEventListener("input",function(){
    C[k]=el.type==="checkbox"?el.checked:(el.type==="range"?+el.value:el.value);save();render();
  });
});
document.querySelectorAll("[data-f]").forEach(function(el){
  el.addEventListener("change",function(){
    var f=el.files[0];if(!f)return;var k=el.dataset.f;
    fset(k,f).then(function(){setFile(k,f);render()});
  });
});
function setFile(k,f){
  if(U[k])URL.revokeObjectURL(U[k]);
  U[k]=URL.createObjectURL(f);if(k==="bg")U.bgType=f.type||"image";
}
/* acceso con usuario y contraseña */
var enc=new TextEncoder();
function b64(b){return btoa(String.fromCharCode.apply(null,new Uint8Array(b)))}
function unb64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function hash(u,p,salt){
  return crypto.subtle.importKey("raw",enc.encode(u.trim().toLowerCase()+"\u0000"+p),"PBKDF2",false,["deriveBits"])
  .then(function(k){return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:salt,iterations:150000},k,256)}).then(b64);
}
var cred=null;try{cred=JSON.parse(localStorage.getItem("cred")||"null")}catch(e){}
var lock={n:0,until:0};
function msg(t){$("lmsg").textContent=t}
function showLogin(){
  var setup=!cred;
  $("lt").textContent=setup?"Crea tu usuario y contraseña":"Entrar a la configuración";
  $("lok").textContent=setup?"Crear acceso":"Entrar";
  $("lp2w").hidden=!setup;msg("");
  $("lu").value="";$("lp").value="";$("lp2").value="";
  $("login").hidden=false;$("lu").focus();
}
function openPanel(){$("login").hidden=true;$("panel").classList.add("open")}
$("gear").onclick=showLogin;
$("lcancel").onclick=function(){$("login").hidden=true};
$("close").onclick=function(){$("panel").classList.remove("open")};
$("lform").onsubmit=function(e){
  e.preventDefault();
  var u=$("lu").value.trim(),p=$("lp").value;
  if(Date.now()<lock.until){msg("Demasiados intentos. Espera 30 segundos.");return}
  if(!u||!p){msg("Escribe usuario y contraseña.");return}
  if(!cred){
    if(p.length<6){msg("La contraseña debe tener al menos 6 caracteres.");return}
    if(p!==$("lp2").value){msg("Las contraseñas no coinciden.");return}
    var salt=crypto.getRandomValues(new Uint8Array(16));
    hash(u,p,salt).then(function(h){
      cred={s:b64(salt),h:h};
      try{localStorage.setItem("cred",JSON.stringify(cred))}catch(x){}
      openPanel();
    }).catch(function(){msg("Este navegador no permite crear el acceso.")});
  }else{
    hash(u,p,unb64(cred.s)).then(function(h){
      if(h===cred.h){lock.n=0;openPanel()}
      else{lock.n++;if(lock.n>=5){lock.until=Date.now()+30000;lock.n=0}msg("Usuario o contraseña incorrectos.")}
    }).catch(function(){msg("No se pudo verificar. Intenta de nuevo.")});
  }
};
$("reset").onclick=function(){
  if(!confirm("¿Restablecer todo el perfil?"))return;
  C={};save();Promise.all([fset("av"),fset("bg"),fset("mu")]).then(function(){location.reload()});
};

/* reproductor */
var au=$("au"),pp=$("pp"),sk=$("seek");
function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
pp.onclick=function(){au.paused?au.play().catch(function(){}):au.pause()};
au.onplay=function(){pp.textContent="❚❚"};au.onpause=function(){pp.textContent="▶"};
au.ontimeupdate=function(){txt("cur",fmt(au.currentTime));if(au.duration)sk.value=au.currentTime/au.duration*100};
au.onloadedmetadata=function(){txt("dur",fmt(au.duration))};
sk.oninput=function(){if(au.duration)au.currentTime=sk.value/100*au.duration};

/* entrada */
function enter(){$("enter").hidden=true;if(U.mu)au.play().catch(function(){})}
$("enter").onclick=enter;
$("enter").onkeydown=function(e){if(e.key==="Enter"||e.key===" ")enter()};

open().then(function(){return Promise.all(["av","bg","mu"].map(function(k){return fget(k).then(function(f){if(f)setFile(k,f)})}))}).then(render);
render();
})();
</script>
</body>
</html>
